<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri - FourtyOneside</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  

  
  <link rel="stylesheet" href="CSS/index.css" />
</head>

<body class="text-slate-800 font-sans antialiased overflow-x-hidden">

  <!-- ===== NAVBAR / HEADER ===== -->
  <header class="fixed top-0 inset-x-0 z-50 bg-white border-b border-slate-200">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-900/40 group-hover:scale-105 transition">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i>
        </div>
        <div class="leading-tight">
          <span class="block font-extrabold text-lg tracking-wide">FourtyOneside</span>
          <span class="block text-[11px] text-slate-400 -mt-0.5">Galeri Foto</span>
        </div>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a href="index.html" class="hover:text-slate-800 transition">Beranda</a>
        <a href="index.html#kelas" class="hover:text-slate-800 transition">Kelas</a>
        <a href="#galeri" class="hover:text-blue-600 transition text-blue-600">Galeri</a>
        <a href="index.html#siswa" class="hover:text-slate-800 transition">Siswa</a>
      </div>

      <!-- Login / Profile Button -->
      <div class="flex items-center gap-3">
        <!-- Not logged in -->
        <a href="login.html" id="loginBtn" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-lg btn-primary text-sm font-semibold">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Login
        </a>

        <!-- Logged in: Profile button -->
        <a href="profil.html" id="userChip" class="hidden items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 transition">
          <img id="headerAvatarImg" src="https://ui-avatars.com/api/?name=User&background=random" alt="Avatar" class="w-7 h-7 rounded-full object-cover" />
          <span id="profileName" class="text-sm font-semibold max-w-[120px] truncate text-slate-700">User</span>
        </a>
        <button id="logoutBtn" title="Logout" class="hidden md:inline-flex p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 transition text-slate-600">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>

        <!-- Mobile menu toggle -->
        <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 transition">
          <i data-lucide="menu" class="w-5 h-5 text-slate-600"></i>
        </button>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="lg:hidden hidden bg-white border-b border-slate-200">
      <div class="p-4 flex flex-col space-y-1 text-sm font-medium text-slate-600">
        <a href="index.html" class="text-gray-700 hover:text-blue-600 font-medium py-2 px-3 rounded-lg hover:bg-gray-50 block transition">Beranda</a>
        <a href="index.html#kelas" class="text-gray-700 hover:text-blue-600 font-medium py-2 px-3 rounded-lg hover:bg-gray-50 block transition">Kelas</a>
        <a href="#galeri" class="text-gray-700 hover:text-blue-600 font-medium py-2 px-3 rounded-lg hover:bg-gray-50 block transition">Galeri</a>
        <a href="index.html#siswa" class="text-gray-700 hover:text-blue-600 font-medium py-2 px-3 rounded-lg hover:bg-gray-50 block transition">Siswa</a>
        <hr class="my-3 border-gray-100">
        <div id="mobileAuthLinks">
          <a href="login.html" id="mobileLoginBtn" class="bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-xl w-full text-center block shadow-sm hover:bg-blue-700 transition">Login</a>
          <a href="profil.html" id="mobileProfilBtn" class="hidden bg-white border border-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl w-full text-center block hover:bg-slate-50 transition mt-2">Profil Saya</a>
          <button id="mobileLogoutBtn" class="hidden bg-red-50 text-red-600 font-semibold py-2.5 px-4 rounded-xl w-full text-center block hover:bg-red-100 transition mt-2">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== GALERI SECTION ===== -->
  <section id="galeri" class="pt-32 pb-20 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 text-left w-full">
        <div class="text-left">
          <h2 class="text-3xl font-bold text-slate-800">Momen Tak Terlupakan</h2>
          <p class="text-slate-500 mt-1">Dokumentasi setiap momen berharga Angkatan 41.</p>
        </div>
        <div class="flex items-center gap-3">
          <button id="uploadBtn" class="hidden inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition shadow-sm">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            Upload Foto
          </button>
        </div>
      </div>

      <!-- Masonry Gallery Grid -->
      <div id="galleryGrid" class="masonry mt-10"></div>
    </div>
  </section>

   <!-- ===== FOOTER ===== -->
   <footer class="mt-10 border-t border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i>
        </div>
        <div class="leading-tight">
          <span class="block font-extrabold text-slate-900">ANGKATAN 41</span>
          <span class="block text-[11px] text-slate-500">Together We Rise</span>
        </div>
      </div>
      <p class="text-center text-xs text-slate-400">&copy; 2026 · FourtyoneSide | Website Angkatan 41</p>
      <div class="hidden md:block"></div>
    </div>
  </footer>

  <!-- ===== IMAGE PREVIEW LIGHTBOX MODAL ===== -->
  <div id="imagePreviewModal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" id="previewBackdrop"></div>
    <button id="closePreviewBtn" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/40 hover:bg-black/60 text-white transition -webkit-tap-highlight-color: transparent" style="touch-action: manipulation;">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
    <img id="previewImage" src="" alt="Preview" class="relative max-w-[90vw] max-h-[85vh] object-contain rounded-2xl shadow-2xl" />
  </div>

  <!-- ===== ADMIN UPLOAD MODAL ===== -->
  <div id="adminModal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" id="modalBackdrop"></div>
    <div class="relative card rounded-2xl p-6 sm:p-8 w-full max-w-md">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold flex items-center gap-2 text-slate-800">
          <i data-lucide="upload-cloud" class="w-5 h-5 text-blue-600"></i>
          Upload Foto Baru
        </h3>
        <button id="closeModal" class="p-2 rounded-lg hover:bg-slate-100 transition text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="uploadForm" class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Foto (maks 5MB)</label>
          <input type="file" id="fotoInput" accept="image/*" class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 outline-none focus:border-blue-500 transition text-sm" />
          <img id="fotoPreview" src="" alt="Preview" class="hidden mt-3 w-full max-h-48 object-cover rounded-xl" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Caption</label>
          <input type="text" id="photoCaption" required placeholder="Tuliskan caption momen ini..." class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 outline-none focus:border-blue-500 transition text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Tanggal Kegiatan</label>
          <input type="date" id="photoDate" required class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 outline-none focus:border-blue-500 transition text-sm" />
        </div>
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition shadow-sm">
          <i data-lucide="cloud-upload" class="w-5 h-5"></i>
          Simpan Foto
        </button>
      </form>
    </div>
  </div>

  <script src="supabase-config.js?v=2.0"></script>
  
  <script src="js/galeri.js"></script>
</body>
</html>
